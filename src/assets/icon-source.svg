    <!-- head -->
    <circle cx="245" cy="270" r="118"/>
    <!-- beak -->
    <path d="M 335 240 L 462 268 L 335 306 L 358 268 Z"/>
    <!-- shaggy throat feathers, bottom-front -->
    <path d="M 210 372 L 196 432 L 232 366 L 236 424 L 262 364 L 278 416 L 292 360 L 312 400 L 316 352 Z"/>
  </g>

  <!-- eye -->
  <circle cx="272" cy="238" r="13" fill="#0a0b0d"/>
