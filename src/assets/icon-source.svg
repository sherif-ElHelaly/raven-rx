<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101216"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#1c1f24" stroke-width="2"/>

  <!-- Raven head, profile facing right -->
  <g fill="#9a9d78">
    <!-- crest / head feathers, top-back -->
